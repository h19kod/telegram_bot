[project]
name = "sop-backend"
version = "0.1.0"
description = "Smart Ordering Platform — Django backend"
requires-python = ">=3.13,<3.14"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    "drf-spectacular>=0.28",
    "django-filter>=24.3",
    "django-environ>=0.11",
    "django-cors-headers>=4.4",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "django-redis>=5.4",
    "celery>=5.4",
    "channels>=4.1",
    "channels-redis>=4.2",
    "cryptography>=43",
    "phonenumberslite>=8.13",
    "pillow>=11",
    "django-storages[s3]>=1.14",
    "argon2-cffi>=23.1",
    "httpx>=0.27",
    "pyotp>=2.9",
    "openpyxl>=3.1",
    "uuid6>=2024.7",
    "python-json-logger>=2.0",
    "sentry-sdk[django]>=2.0",
    "gunicorn>=23",
    "uvicorn[standard]>=0.30",
    "anthropic>=0.80",
    "whitenoise>=6.7",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "factory-boy>=3.3",
    "time-machine>=2.15",
    "respx>=0.21",
    "ruff>=0.7",
    "mypy>=1.13",
    "django-stubs[compatible-mypy]>=5.1",
    "djangorestframework-stubs>=3.15",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "-q --strict-markers --reuse-db"
testpaths = ["apps", "core", "tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S", "C4", "SIM", "RUF", "PT"]
ignore = ["S101", "RUF012", "S105", "S106", "E501", "RUF001", "RUF002", "RUF003", "DJ008"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "B"]
"tests/**" = ["S", "B"]

[tool.coverage.run]
source = ["apps", "core"]
omit = ["*/migrations/*", "*/tests/*"]
