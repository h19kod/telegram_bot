root /srv/miniapp;
include /etc/nginx/snippets/common.conf;
# Telegram clients embed the Mini App; the official SDK script loads from telegram.org.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self'; frame-ancestors https://web.telegram.org https://*.telegram.org; base-uri 'self'" always;
location / { try_files $uri /index.html; }
