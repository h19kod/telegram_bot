root /srv/dashboard;
include /etc/nginx/snippets/common.conf;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Frame-Options DENY always;

location /tg/webhook/ {
    limit_req zone=tg burst=200 nodelay;
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass http://bot;
}
location /django-admin/ {
    # Restrict to trusted networks in production (edit the allow list).
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    deny all;
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass http://api;
}
location /static/ { include /etc/nginx/snippets/proxy.conf; proxy_pass http://api; }
location / { try_files $uri /index.html; }
