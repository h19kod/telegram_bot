user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events { worker_connections 2048; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format json escape=json '{"time":"$time_iso8601","ip":"$remote_addr","method":"$request_method",'
        '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,"rt":$request_time,'
        '"ua":"$http_user_agent","rid":"$request_id"}';
    access_log /dev/stdout json;

    sendfile on;
    tcp_nopush on;
    server_tokens off;
    keepalive_timeout 30;
    client_max_body_size 6m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    limit_req_zone $binary_remote_addr zone=api:20m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_zone $uri zone=tg:10m rate=100r/s;
    limit_req_status 429;

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    include /etc/nginx/conf.d/*.conf;
}
